spring.application.name=booking-service
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/booking_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Debug Logging - See all publish/consume activity
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit.listener=DEBUG
logging.level.com.vasu.bookingservice.event=DEBUG

# Movie Service URL
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8082}

# Redis Configuration
spring.data.redis.url=${REDIS_URL:redis://default:your_redis_password@localhost:6379}
spring.data.redis.timeout=5000
# Seat hold TTL in seconds (15 minutes)
booking.seat-hold.ttl=900
# Scheduled cleanup interval in milliseconds (2 minutes)
booking.seat-hold.cleanup-interval=120000
