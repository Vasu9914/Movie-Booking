spring.application.name=api-gateway

server.port=8080

# JWT secret – must match the value used by user-service to sign tokens
jwt.secret=${JWT_SECRET:MySecretKey12345678901234567890123456789012345678901234567890}

# ============================================================
# Route definitions – Spring Cloud Gateway 5.x (Spring Boot 4) syntax
# Each microservice is reachable via /api/* on port 8080
# ============================================================

# User Service (port 8081) – auth & user profile
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# Movie Service (port 8082) – movies, theatres, screens, shows
spring.cloud.gateway.server.webflux.routes[1].id=movie-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://movie-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/movies/**,/api/theatres/**,/api/screens/**,/api/shows/**

# Booking Service (port 8083) – bookings, holds, show seats
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://booking-service:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings/**,/api/shows/{showId}/seats,/api/shows/{showId}/holds

# Payment Service (port 8084) – payments & refunds
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://payment-service:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments/**,/api/refunds/**

# Review Service (port 8086) – reviews
spring.cloud.gateway.server.webflux.routes[4].id=review-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://review-service:8086
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/reviews/**

# Notification Service (port 8085) – notifications
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://notification-service:8085
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# Logging
# ============================================================

logging.level.com.vasu.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
